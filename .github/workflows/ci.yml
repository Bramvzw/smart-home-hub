name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php:
    name: PHP — Pint, PHPUnit, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite
          coverage: none

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Code style (Pint)
        run: vendor/bin/pint --test

      - name: Modernization gate (Rector dry-run)
        run: composer rector

      - name: Static analysis (PHPStan level 8)
        run: composer analyse -- --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: composer test

      - name: Security audit
        run: composer audit

  frontend:
    name: Frontend — Jest, Vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
